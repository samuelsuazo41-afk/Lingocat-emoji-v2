<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Lingo Emoji</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F1115">
<style>
:root {
  /* Paleta 2026 - Dark premium azulado */
  --bg: #0F1115;
  --bg-elevated: #1A1D23;
  --card: #1E2229;
  --text: #F5F7FA;
  --text-muted: #A3A8B3;
  --accent: #4F9CF9;      /* Azul educativo moderno */
  --accent-soft: #7BB0FF;
  --success: #22C55E;
  --border: #2A2F38;
  --shadow: rgba(0, 0, 0, 0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(ellipse at top left, #151821 0%, #0F1115 100%);
  color: var(--text);
  padding-bottom: 80px;
  letter-spacing: -0.01em;
}

header {
  background: rgba(26, 29, 35, 0.8);
  backdrop-filter: blur(12px);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px var(--shadow);
}

.header-stats { 
  display: flex; 
  gap: 16px; 
  font-size: 14px;
  align-items: center;
}

/* Barra de progreso del personaje */
.stat-progress {
  display: flex;
  align-items: center;
  gap: 6px;
}
.progress-bar {
  width: 60px;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-soft));
  width: 0%;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.stat-level {
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
}

.tab-content { display: none; padding: 16px; }
.tab-content.active { display: block; }

.nivells-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
  gap: 10px;
  max-width: 600px;
  margin: 0 auto;
}
.nivell-card {
  aspect-ratio: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 2px 8px var(--shadow);
}
.nivell-card:hover { 
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 8px 20px rgba(79, 156, 249, 0.15);
}

.missio-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  transition: transform 0.2s ease;
}
.missio-item:hover {
  transform: translateX(4px);
  border-color: var(--accent);
}

/* Subtabs con scroll lateral */
.sub-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.sub-tabs::-webkit-scrollbar { display: none; }
.sub-tab-btn {
  flex-shrink: 0;
  padding: 10px 18px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: all 0.2s ease;
}
.sub-tab-btn:hover {
  background: var(--bg-elevated);
  color: var(--text);
}
.sub-tab-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 4px 12px rgba(79, 156, 249, 0.3);
}

.emoji-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 12px;
}
.emoji-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  transition: all 0.2s ease;
}
.emoji-item:hover {
  transform: scale(1.05);
  border-color: var(--accent);
}
.emoji-large { font-size: 32px; margin-bottom: 6px; }
.emoji-name { font-size: 12px; color: var(--text-muted); }

.capitol-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  text-align: center;
  transition: all 0.3s ease;
}
.capitol-card:hover {
  border-color: var(--accent);
  box-shadow: 0 8px 24px var(--shadow);
}
.capitol-icona { font-size: 48px; margin-bottom: 12px; }

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: inherit;
}
.btn:active {
  transform: scale(0.97);
}
.btn-primari { 
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  color: #fff;
  box-shadow: 0 4px 14px rgba(79, 156, 249, 0.3);
}
.btn-primari:hover {
  box-shadow: 0 6px 20px rgba(79, 156, 249, 0.4);
  transform: translateY(-1px);
}
.btn-sec { 
  background: var(--bg-elevated);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-sec:hover {
  background: var(--card);
  border-color: var(--accent);
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.lectura-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  max-width: 600px;
  margin: 0 auto;
  box-shadow: 0 4px 20px var(--shadow);
}
.lectura-text { line-height: 1.7; margin: 20px 0; font-size: 16px; }

.tip-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
  box-shadow: 0 4px 20px var(--shadow);
}
.tip-text { font-size: 18px; margin: 16px 0; font-weight: 500; }
.tip-exemple { color: var(--accent-soft); font-style: italic; margin-top: 12px; }

.minijoc-container { max-width: 600px; margin: 0 auto; }
.minijoc-frase {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  font-size: 20px;
  text-align: center;
  margin-bottom: 20px;
  font-weight: 500;
}
.minijoc-triats {
  min-height: 50px;
  background: var(--bg-elevated);
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 20px;
  text-align: center;
}
.minijoc-feedback { text-align: center; min-height: 30px; margin-top: 16px; }

/* Vocab y Gramática cards */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
}
.vocab-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
  transition: all 0.2s ease;
}
.vocab-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}
.vocab-word { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
.vocab-pron { font-size: 12px; color: var(--text-muted); }

/* Intro */
.intro-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 17, 21, 0.95);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.intro-content {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 40px 32px;
  max-width: 400px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.intro-emoji { font-size: 80px; margin-bottom: 20px; }
.intro-titol { font-size: 26px; margin-bottom: 12px; font-weight: 700; }
.intro-text { color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; }
.intro-dots { margin-bottom: 28px; font-size: 20px; }

/* Bottom nav con scroll lateral */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(26, 29, 35, 0.85);
  backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 10px 0;
  box-shadow: 0 -4px 20px var(--shadow);
}
.bottom-nav::-webkit-scrollbar { display: none; }
.nav-item {
  flex-shrink: 0;
  width: 72px;
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 10px 8px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
}
.nav-item.active { 
  color: var(--accent);
  transform: translateY(-2px);
}
.nav-icon { font-size: 22px; }

/* Mensaje flotante */
.app-message {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, var(--accent), var(--accent-soft));
  color: #fff;
  padding: 14px 24px;
  border-radius: 12px;
  font-weight: 600;
  z-index: 9999;
  animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  max-width: 90%;
  text-align: center;
  box-shadow: 0 8px 24px rgba(79, 156, 249, 0.4);
}
@keyframes slideDown {
  from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
</style>
</head>
<body>

<header>
  <div style="font-weight: bold; font-size: 18px;">🐱 Cat Lingo Emoji</div>
  <div class="header-stats">
    <span>🪙 <span id="monedes">0</span></span>
    <div class="stat-progress">
      <span id="header-personatge">👨</span>
      <div class="progress-bar">
        <div id="barra-progres" class="progress-fill"></div>
      </div>
      <span class="stat-level"><span id="nivell">1</span></span>
    </div>
    <span>⚡ <span id="energia">100</span></span>
  </div>
</header>

<!-- INTRO -->
<div id="intro" class="intro-overlay" style="display:none;">
  <div class="intro-content">
    <div id="intro-emoji" class="intro-emoji">👋</div>
    <h2 id="intro-titol" class="intro-titol">Benvingut</h2>
    <p id="intro-text" class="intro-text">Text</p>
    <div id="intro-dots" class="intro-dots">●</div>
    <button id="intro-btn" class="btn btn-primari" onclick="seguentSlide()">Següent</button>
    <button class="btn btn-sec" onclick="tancarIntro()" style="margin-top:8px;">Saltar</button>
  </div>
</div>

<!-- TAB MAPA -->
<div id="tab-mapa" class="tab-content">
  <div id="mapa-contenidor"></div>
</div>

<!-- TAB MISSIO -->
<div id="tab-missio" class="tab-content">
  <div id="missio-contenidor"></div>
</div>

<!-- TAB GREMI -->
<div id="tab-gremi" class="tab-content">
  <div class="sub-tabs">
    <button class="sub-tab-btn" onclick="mostrarSubTab('personatges')">Personatges</button>
    <button class="sub-tab-btn" onclick="mostrarSubTab('biblioteca')">Biblioteca</button>
    <button class="sub-tab-btn" onclick="mostrarSubTab('minijoc')">Minijoc</button>
  </div>
  <div id="gremi-contenidor">
    <div id="gremi-personatges" class="sub-tab-content"></div>
    <div id="gremi-biblioteca" class="sub-tab-content"></div>
    <div id="gremi-minijoc" class="sub-tab-content">
      <div class="minijoc-container">
        <div id="minijoc-nivell" style="text-align:center; margin-bottom:12px; color:#888;"></div>
        <div id="minijoc-frase" class="minijoc-frase">Carregant...</div>
        <div id="minijoc-triats" class="minijoc-triats"></div>
        <div id="minijoc-emojis" class="emoji-grid"></div>
        <div id="minijoc-feedback" class="minijoc-feedback"></div>
      </div>
    </div>
  </div>
</div>

<!-- TAB LECTURA - NUEVAS 3 SUBTUBS -->
<div id="tab-lectura" class="tab-content">
  <div class="sub-tabs">
    <button class="sub-tab-btn active" onclick="mostrarSubTab('lectura')">Lectura</button>
    <button class="sub-tab-btn" onclick="mostrarSubTab('vocab')">Vocabulari</button>
    <button class="sub-tab-btn" onclick="mostrarSubTab('gramatica')">Gramàtica</button>
  </div>
  <div id="lectura-contenidor">
    <div id="gremi-lectura" class="sub-tab-content" style="display:block;">
      <div id="lectura-texto"></div>
    </div>
    <div id="gremi-vocab" class="sub-tab-content" style="display:none;">
      <div id="lectura-vocab"></div>
    </div>
    <div id="gremi-gramatica" class="sub-tab-content" style="display:none;">
      <div id="lectura-gramatica"></div>
    </div>
  </div>
</div>

<!-- TAB TIPS -->
<div id="tab-tips" class="tab-content">
  <div class="tip-card">
    <h3>💡 Truc del dia</h3>
    <p id="tip-text" class="tip-text">Carregant...</p>
    <p id="tip-exemple" class="tip-exemple"></p>
    <button class="btn btn-primari" onclick="mostrarTipRandom()">Següent tip</button>
  </div>
</div>

<!-- TAB BOTIGA -->
<div id="tab-botiga" class="tab-content">
  <div id="botiga-contenidor"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="canviarTab('mapa', event)">
    <span class="nav-icon">🗺️</span>
    <span>Mapa</span>
  </button>
  <button class="nav-item" onclick="canviarTab('missio', event)">
    <span class="nav-icon">🎯</span>
    <span>Missió</span>
  </button>
  <button class="nav-item" onclick="canviarTab('gremi', event)">
    <span class="nav-icon">🏛️</span>
    <span>Gremi</span>
  </button>
  <button class="nav-item" onclick="canviarTab('lectura', event)">
    <span class="nav-icon">📖</span>
    <span>Lectura</span>
  </button>
  <button class="nav-item" onclick="canviarTab('tips', event)">
    <span class="nav-icon">💡</span>
    <span>Tips</span>
  </button>
  <button class="nav-item" onclick="canviarTab('botiga', event)">
    <span class="nav-icon">🛒</span>
    <span>Botiga</span>
  </button>
</nav>

<!-- Contenedor para mensajes flotantes -->
<div id="app-message" style="display:none;"></div>

<script>
function mostrarMissatge(text) {
  const msg = document.getElementById('app-message');
  msg.textContent = text;
  msg.className = 'app-message';
  msg.style.display = 'block';
  setTimeout(() => {
    msg.style.display = 'none';
  }, 2000);
}
</script>
<script src="./main.js"></script>
</body>
</html>
