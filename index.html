<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Lingo Emoji</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- HEADER AMB BARRA PROGRÉS -->
  <div class="header">
    <div class="stat"><span>🪙</span><span id="monedes">0</span></div>
    
    <div class="stat-progress">
      <div class="stat-icon" id="header-personatge">👨</div>
      <div class="progress-bar">
        <div id="barra-progres" class="progress-fill"></div>
      </div>
      <div class="stat-level"><span id="nivell">1</span></div>
    </div>
    
    <div class="stat"><span>⚡</span><span id="energia">100</span></div>
  </div>

  <!-- NAVEGACIÓ PRINCIPAL AMB SCROLL -->
  <div class="nav-bottom">
    <button class="nav-item active" data-tab="mapa" onclick="canviarTab('mapa',event)">Mapa</button>
    <button class="nav-item" data-tab="missio" onclick="canviarTab('missio',event)">Missió</button>
    <button class="nav-item" data-tab="gremi" onclick="canviarTab('gremi',event)">Gremi</button>
    <button class="nav-item" data-tab="lectura" onclick="canviarTab('lectura',event)">Lectura</button>
    <button class="nav-item" data-tab="tips" onclick="canviarTab('tips',event)">Tips</button>
    <button class="nav-item" data-tab="botiga" onclick="canviarTab('botiga',event)">Botiga</button>
  </div>

  <!-- CONTINGUT TABS -->
  <div id="tab-mapa" class="tab-content active">
    <div id="mapa-contenidor"></div>
  </div>

  <div id="tab-missio" class="tab-content">
    <div id="missio-contenidor"></div>
  </div>

  <div id="tab-gremi" class="tab-content">
    <!-- SUB-TABS AMB SCROLL -->
    <div class="sub-tabs">
      <button class="sub-tab-btn active" onclick="mostrarSubTab('personatges')">Personatges</button>
      <button class="sub-tab-btn" onclick="mostrarSubTab('biblioteca')">Biblioteca</button>
      <button class="sub-tab-btn" onclick="mostrarSubTab('llegendes')">Llegendes</button>
      <button class="sub-tab-btn" onclick="mostrarSubTab('minijoc')">Minijoc</button>
    </div>
    <div id="gremi-contenidor"></div>
    <div id="gremi-biblioteca" class="sub-tab-content"></div>
  </div>

  <div id="tab-lectura" class="tab-content">
    <div id="lectura-contingut"></div>
  </div>

  <div id="tab-tips" class="tab-content tip-container">
    <div id="tip-text"></div>
    <div id="tip-exemple"></div>
    <button class="btn-primari" id="btn-seguent-tip">Següent tip</button>
  </div>

  <div id="tab-botiga" class="tab-content">
    <div id="botiga-contenidor"></div>
  </div>

  <!-- INTRO -->
  <div id="intro" style="display:none;position:fixed;inset:0;background:#000;z-index:999;flex-direction:column;justify-content:center;align-items:center;">
    <div id="intro-emoji" style="font-size:80px;"></div>
    <h2 id="intro-titol"></h2>
    <p id="intro-text"></p>
    <div id="intro-dots"></div>
    <button id="intro-btn" class="btn-primari" onclick="seguentSlide()"></button>
  </div>

  <script src="main.js"></script>
</body>
</html>
