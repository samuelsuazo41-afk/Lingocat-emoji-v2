<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Lingo Emoji</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d0d0d">
<style>
:root {
  --bg: #0d0d0d;
  --card: #1a1a1a;
  --text: #f5f5f5;
  --accent: #22c55e;
  --accent2: #3b82f6;
  --border: #2a2a2a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 80px;
}
header {
  background: var(--card);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-stats { 
  display: flex; 
  gap: 16px; 
  font-size: 14px;
  align-items: center;
}

/* Barra de progreso del personaje */
.stat-progress {
  display: flex;
  align-items: center;
  gap: 6px;
}
.progress-bar {
  width: 60px;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.4s ease;
}
.stat-level {
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
}

.tab-content { display: none; padding: 16px; }
.tab-content.active { display: block; }
.nivells-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
  gap: 8px;
  max-width: 600px;
  margin: 0 auto;
}
.nivell-card {
  aspect-ratio: 1;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  transition: all 0.2s;
}
.nivell-card:hover { transform: scale(1.05); }
.missio-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
}

/* Subtabs con scroll lateral */
.sub-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.sub-tabs::-webkit-scrollbar { display: none; }
.sub-tab-btn {
  flex-shrink: 0;
  padding: 8px 16px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
}
.sub-tab-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
}

.emoji-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 12px;
}
.emoji-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}
.emoji-large { font-size: 32px; margin-bottom: 4px; }
.emoji-name { font-size: 12px; color: #aaa; }
.capitol-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  text-align: center;
}
.capitol-icona { font-size: 48px; margin-bottom: 8px; }
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}
.btn-primari { background: var(--accent); color: #000; }
.btn-sec { background: var(--border); color: var(--text); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.lectura-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  max-width: 600px;
  margin: 0 auto;
}
.lectura-text { line-height: 1.6; margin: 16px 0; font-size: 16px; }
.tip-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
}
.tip-text { font-size: 18px; margin: 16px 0; }
.tip-exemple { color: var(--accent); font-style: italic; margin-top: 12px; }
.minijoc-container { max-width: 600px; margin: 0 auto; }
.minijoc-frase {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  font-size: 20px;
  text-align: center;
  margin-bottom: 20px;
}
.minijoc-triats {
  min-height: 50px;
  background: var(--card);
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 20px;
  text-align: center;
}
.minijoc-feedback { text-align: center; min-height: 30px; margin-top: 16px; }

/* Vocab y Gramática cards */
.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
}
.vocab-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}
.vocab-word { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.vocab-pron { font-size: 12px; color: #aaa; }

/* Intro */
.intro-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.intro-content {
  background: var(--card);
  border-radius: 16px;
  padding: 32px;
  max-width: 400px;
  text-align: center;
}
.intro-emoji { font-size: 80px; margin-bottom: 16px; }
.intro-titol { font-size: 24px; margin-bottom: 12px; }
.intro-text { color: #aaa; margin-bottom: 24px; }
.intro-dots { margin-bottom: 24px; font-size: 20px; }

/* Bottom nav con scroll lateral */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 8px 0;
}
.bottom-nav::-webkit-scrollbar { display: none; }
.nav-item {
  flex-shrink: 0;
  width: 70px;
  background: transparent;
  border: none;
  color: #888;
  padding: 8px;
  cursor: pointer;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 20px; }
</style>
</head>
<body>

<header>
  <div style="font-weight: bold; font-size: 18px;">🐱 Cat Lingo Emoji</div>
  <div class="header-stats">
    <span>🪙 <span id="monedes">0</span></span>
    <div class="stat-progress">
      <span id="header-personatge">👨</span>
      <div class="progress-bar">
        <div id="barra-progres" class="progress-fill"></div>
      </div>
      <span class="stat-level"><span id="nivell">1</span></span>
    </div>
    <span>⚡ <span id="energia">100</span></span>
  </div>
</header>

<!-- INTRO -->
<div id="intro" class="intro-overlay" style="display:none;">
  <div class="intro-content">
    <div id="intro-emoji" class="intro-emoji">👋</div>
    <h2 id="intro-titol" class="intro-titol">Benvingut</h2>
    <p id="intro-text" class="intro-text">Text</p>
    <div id="intro-dots" class="intro-dots">●</div>
    <button id="intro-btn" class="btn btn-primari" onclick="seguentSlide()">Següent</button>
    <button class="btn btn-sec" onclick="tancarIntro()" style="margin-top:8px;">Saltar</button>
  </div>
</div>

<!-- TAB MAPA -->
<div id="tab-mapa" class="tab-content">
  <div id="mapa-contenidor"></div>
</div>

<!-- TAB MISSIO -->
<div id="tab-missio" class="tab-content">
  <div id="missio-contenidor"></div>
</div>

<!-- TAB GREMI -->
<div id="tab-gremi" class="tab-content">
  <div class="sub-tabs">
    <button class="sub-tab-btn" onclick="mostrarSubTab('personatges')">Personatges</button>
    <button class="sub-tab-btn" onclick="mostrarSubTab('biblioteca')">Biblioteca</button>
    <button class="sub-tab-btn" onclick="mostrarSubTab('minijoc')">Minijoc</button>
  </div>
  <div id="gremi-contenidor">
    <div id="gremi-personatges" class="sub-tab-content"></div>
    <div id="gremi-biblioteca" class="sub-tab-content"></div>
    <div id="gremi-minijoc" class="sub-tab-content">
      <div class="minijoc-container">
        <div id="minijoc-nivell" style="text-align:center; margin-bottom:12px; color:#888;"></div>
        <div id="minijoc-frase" class="minijoc-frase">Carregant...</div>
        <div id="minijoc-triats" class="minijoc-triats"></div>
        <div id="minijoc-emojis" class="emoji-grid"></div>
        <div id="minijoc-feedback" class="minijoc-feedback"></div>
      </div>
    </div>
  </div>
</div>

<!-- TAB LECTURA - NUEVAS 3 SUBTUBS -->
<div id="tab-lectura" class="tab-content">
  <div class="sub-tabs">
    <button class="sub-tab-btn active" onclick="mostrarSubTab('lectura')">Lectura</button>
    <button class="sub-tab-btn" onclick="mostrarSubTab('vocab')">Vocabulari</button>
    <button class="sub-tab-btn" onclick="mostrarSubTab('gramatica')">Gramàtica</button>
  </div>
  <div id="lectura-contenidor">
    <div id="gremi-lectura" class="sub-tab-content" style="display:block;">
      <div id="lectura-texto"></div>
    </div>
    <div id="gremi-vocab" class="sub-tab-content" style="display:none;">
      <div id="lectura-vocab"></div>
    </div>
    <div id="gremi-gramatica" class="sub-tab-content" style="display:none;">
      <div id="lectura-gramatica"></div>
    </div>
  </div>
</div>

<!-- TAB TIPS -->
<div id="tab-tips" class="tab-content">
  <div class="tip-card">
    <h3>💡 Truc del dia</h3>
    <p id="tip-text" class="tip-text">Carregant...</p>
    <p id="tip-exemple" class="tip-exemple"></p>
    <button class="btn btn-primari" onclick="mostrarTipRandom()">Següent tip</button>
  </div>
</div>

<!-- TAB BOTIGA -->
<div id="tab-botiga" class="tab-content">
  <div id="botiga-contenidor"></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="canviarTab('mapa', event)">
    <span class="nav-icon">🗺️</span>
    <span>Mapa</span>
  </button>
  <button class="nav-item" onclick="canviarTab('missio', event)">
    <span class="nav-icon">🎯</span>
    <span>Missió</span>
  </button>
  <button class="nav-item" onclick="canviarTab('gremi', event)">
    <span class="nav-icon">🏛️</span>
    <span>Gremi</span>
  </button>
  <button class="nav-item" onclick="canviarTab('lectura', event)">
    <span class="nav-icon">📖</span>
    <span>Lectura</span>
  </button>
  <button class="nav-item" onclick="canviarTab('tips', event)">
    <span class="nav-icon">💡</span>
    <span>Tips</span>
  </button>
  <button class="nav-item" onclick="canviarTab('botiga', event)">
    <span class="nav-icon">🛒</span>
    <span>Botiga</span>
  </button>
</nav>

<script src="./main.js"></script>
</body>
</html>
